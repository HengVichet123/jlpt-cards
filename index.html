<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind Palace">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">

<title>Japanese Mind Palace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
  rel="stylesheet"
>

</head>


<body>

<header id="top">

  <div class="bar">
    <button class="back-link" id="goHome" type="button">‹ Home</button>
    <div class="page-title" id="pageTitle"></div>
    <span id="ver"></span>
    <button class="hdr-act" id="hdrAct" type="button" hidden></button>
    <button class="nav-btn fam-toggle" id="famToggle" hidden aria-pressed="false" aria-label="Show familiarity">
      <svg viewBox="0 0 40 14" width="38" height="14" aria-hidden="true"><rect x="2" y="3" width="36" height="3" rx="1.5" fill="currentColor" opacity=".35"/><path d="M26 13 L30 7 L34 13 Z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="tabs" hidden>
    <div class="tab on" data-t="words"><span class="jp">語</span>Words</div>
    <div class="tab" data-t="kanji"><span class="jp">字</span>Kanji</div>
    <div class="tab" data-t="grammar"><span class="jp">文</span>Grammar</div>
  </div>

  <!-- kept for older code paths; not shown -->
  <select id="lesson" hidden></select>
  <button class="small" id="filter" hidden>All</button>
  <span id="count" hidden></span>

</header>


<main id="list">

  <div class="empty">
    Loading…
  </div>

</main>


<script type="module" src="/src/main.ts"></script>


</body>
