<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JLPT Cards">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>JLPT Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#FBFAF6; --card:#FFFFFF; --ink:#1F2226; --soft:#6F6B64; --faint:#A9A49A; --line:#E7E3DA; --chip:#F2EFE8;
  --shu:#C63A2F; --ai:#2E4C80; --murasaki:#6A4C98; --yamabuki:#B8791A; --hole:#EAE6DD;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15171A; --card:#1E2125; --ink:#ECE8E0; --soft:#A29D94; --faint:#6E6A63; --line:#2C3036; --chip:#262A30;
  --shu:#FF6E5E; --ai:#8FB0EE; --murasaki:#C2A6F0; --yamabuki:#E6B25A; --hole:#15171A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15171A; --card:#1E2125; --ink:#ECE8E0; --soft:#A29D94; --faint:#6E6A63; --line:#2C3036; --chip:#262A30;
  --shu:#FF6E5E; --ai:#8FB0EE; --murasaki:#C2A6F0; --yamabuki:#E6B25A; --hole:#15171A; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--body)}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em}
.brand span{color:var(--shu)}
select{flex:1;min-width:0;font:500 15px var(--body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;padding:3px;background:var(--chip);border-radius:10px}
.tab{text-align:center;padding:7px 0;border-radius:8px;color:var(--soft);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .jp{font-family:var(--display);margin-right:4px}
.tab.on[data-t=words] .jp{color:var(--ai)} .tab.on[data-t=kanji] .jp{color:var(--murasaki)} .tab.on[data-t=grammar] .jp{color:var(--yamabuki)}
.meta{font:500 12px var(--mono);color:var(--faint);margin-top:8px;display:flex;justify-content:space-between;letter-spacing:.02em}
button.small{font:700 12px var(--body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
button.small.on{color:var(--shu);border-color:var(--shu)}
main{padding-block:14px calc(env(safe-area-inset-bottom,0px) + 48px);padding-inline:16px;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px}
.card::before{content:"";position:absolute;left:12px;top:26px;width:10px;height:10px;border-radius:50%;background:var(--hole);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.front{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 14px 12px 34px;cursor:pointer}
.head{min-width:0}
.num{font:500 11px var(--mono);letter-spacing:.04em}
.card.w .num{color:var(--ai)} .card.k .num{color:var(--murasaki)} .card.g .num{color:var(--yamabuki)}
.rd{font-size:13px;color:var(--soft);line-height:1.2;margin-top:2px}
.big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.2;word-break:break-word}
.card.g .big{font-size:21px;font-weight:600;text-wrap:balance}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);cursor:pointer}
.dot.on{background:var(--shu);border-color:var(--shu)}
.back{display:none;padding:2px 16px 16px 34px;border-top:1px dashed var(--line)}
.card.open .back{display:block}
.back h4{margin:14px 0 4px;font:700 11px var(--body);letter-spacing:.12em;color:var(--faint)}
.en{font-weight:700;font-size:16px}
.jp{font-size:15px}
.src{font-size:12px;color:var(--faint)} .src a{color:var(--faint)}
b.hl{color:var(--shu);font-weight:700}
.big b.hl{color:inherit}
.ex{background:var(--chip);border-radius:6px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:15px}
.ex .tip{float:right;font:500 10px var(--mono);color:var(--faint);margin-left:8px;margin-top:4px}
.ex .tr{display:none;color:var(--soft);font-size:14px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.ex.open .tr{display:block}
.img{display:block;width:100%;max-width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin-top:14px}
ul.w{margin:4px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.w li{font-size:15px}
.exl{font-size:13px;color:var(--soft)}
code{font:500 13px var(--mono);background:var(--chip);padding:3px 7px;border-radius:5px;display:inline-block}
.empty{color:var(--soft);text-align:center;padding:40px}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand">単語<span>帳</span></div>
    <select id="lesson"></select>
    <button class="small" id="filter" title="Show only cards with fewer than 3 dots">All</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="words"><span class="jp">語</span>Words</div>
    <div class="tab" data-t="kanji"><span class="jp">字</span>Kanji</div>
    <div class="tab" data-t="grammar"><span class="jp">文</span>Grammar</div>
  </div>
  <div class="meta"><span id="count"></span><span id="ver"></span></div>
</header>
<main id="list"><div class="empty">Loading…</div></main>

<script>
const APP_VERSION = "v2";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text, targets){
  let out = esc(text);
  for (const t of [].concat(targets).filter(Boolean).sort((a,b)=>b.length-a.length)){
    const e = esc(t);
    if (out.includes(e)) { out = out.split(e).join(`<b class="hl">${e}</b>`); break; }
  }
  return out;
}
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let INDEX = [], DATA = null, TAB = new URLSearchParams(location.search).get("tab") || store.get("jc:tab", "words"), ONLY_WEAK = store.get("jc:weak", false);

function dotsKey(type, no){ return `jc:dots:${DATA.level}:${type}:${no}`; }
function dotsHTML(type, no){
  const v = store.get(dotsKey(type, no), [0,0,0]);
  return `<div class="dots" data-type="${type}" data-no="${no}">` +
    v.map((on,i)=>`<div class="dot${on?" on":""}" data-i="${i}"></div>`).join("") + `</div>`;
}
function exHTML(e, targets){
  const tr = e.en ? esc(e.en) : "—";
  const src = e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.src||"source")}</a>` : "";
  return `<div class="ex"><span class="tip">EN</span>${e.src && e.src.startsWith("Wikipedia") ? "🌐 " : ""}${hl(e.jp, targets)}<div class="tr">${tr}${src}</div></div>`;
}
function srcLine(label, url){ return `<div class="src">— ${esc(label)}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">link</a>` : ""}</div>`; }

function wordCard(c){
  const back = [
    c.img ? `<img class="img" loading="lazy" src="${esc(c.img)}" alt="">` : "",
    `<h4>English</h4><div class="en">${esc(c.en)}</div>`,
    c.jp ? `<h4>大辞泉</h4><div class="jp">${hl(c.jp, c.word)}</div>${srcLine("デジタル大辞泉 (Kotobank)", c.jpUrl)}` : "",
    c.use ? `<h4>例文</h4>${exHTML(c.use, c.word)}` : ""
  ].join("");
  return card("w", c.no, `<div class="rd">${esc(c.reading)}</div><div class="big">${esc(c.word)}</div>`, back);
}
function kanjiCard(c){
  const words = c.words.length ? `<h4>言葉</h4><ul class="w">` + c.words.map(w =>
      `<li>${hl(w.w, c.kanji)}（${esc(w.r)}）— ${esc(w.m)}${w.ex ? `<div class="exl">例：${hl(w.ex, c.kanji)}</div>` : ""}</li>`).join("") + `</ul>` : "";
  const back = [
    `<h4>読み</h4><div>音 <b>${esc(c.on.join("・")||"—")}</b>　訓 <b>${esc(c.kun.join("・")||"—")}</b>　<span class="src">${c.strokes}画</span></div>`,
    `<h4>意味</h4><div class="en">${esc(c.en)}</div>`,
    c.jp ? `<div class="jp">${hl(c.jp, c.kanji)}</div>${srcLine("デジタル大辞泉［漢字項目］", c.jpUrl)}` : "",
    words,
    c.use ? `<h4>例文</h4>${exHTML(c.use, c.kanji)}` : ""
  ].join("");
  const rd = [c.on.join("・"), c.kun.join("・")].filter(Boolean).join(" · ");
  return card("k", c.no, `<div class="rd">${esc(rd)}</div><div class="big">${esc(c.kanji)}</div>`, back);
}
function grammarCard(c){
  const back = [
    c.en ? `<h4>English</h4><div class="en">${esc(c.en)}</div>` : "",
    c.imi.length ? `<h4>意味</h4>${c.imi.map(x=>`<div>${esc(x)}</div>`).join("")}` : "",
    c.setsuzoku.length ? `<h4>接続</h4><code>${esc(c.setsuzoku.join(" / "))}</code>` : "",
    c.rei.length ? `<h4>例文 <span class="src">(tap for English)</span></h4>${c.rei.map(e=>exHTML(e, c.variants)).join("")}` : "",
    srcLine("日本語教師NET", c.url)
  ].join("");
  return card("g", c.no, `<div class="rd"></div><div class="big">${esc(c.pattern)}</div>`, back);
}
function card(t, no, head, back){
  const type = {w:"words",k:"kanji",g:"grammar"}[t];
  return `<div class="card ${t}" data-type="${type}" data-no="${no}">
    <div class="front"><div class="head">${head.replace('<div class="rd">', `<div class="rd"><span class="num">#${t.toUpperCase()}${no}</span>　`)}</div>${dotsHTML(type,no)}</div>
    <div class="back">${back}</div></div>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("on", el.dataset.t === TAB));
  $("#filter").textContent = ONLY_WEAK ? "Weak only" : "All";
  $("#filter").classList.toggle("on", ONLY_WEAK);
  if (!DATA) return;
  let items = DATA[TAB];
  if (ONLY_WEAK) items = items.filter(c => store.get(dotsKey(TAB, c.no), [0,0,0]).filter(Boolean).length < 3);
  const make = {words: wordCard, kanji: kanjiCard, grammar: grammarCard}[TAB];
  $("#list").innerHTML = items.length ? items.map(make).join("") : `<div class="empty">Nothing here.</div>`;
  $("#count").textContent = `${DATA.level} Day ${DATA.day} · ${items.length} cards`;
  const q = new URLSearchParams(location.search);
  if (q.has("open")) document.querySelectorAll(".card").forEach((c,i)=>{ if(i<+q.get("open")) c.classList.add("open"); });
  if (q.has("ex")) document.querySelectorAll(".ex").forEach(x=>x.classList.add("open"));
}

document.addEventListener("click", e => {
  const dot = e.target.closest(".dot");
  if (dot){
    const box = dot.parentElement, k = dotsKey(box.dataset.type, box.dataset.no);
    const v = store.get(k, [0,0,0]); v[+dot.dataset.i] = v[+dot.dataset.i] ? 0 : 1; store.set(k, v);
    dot.classList.toggle("on", !!v[+dot.dataset.i]); return;
  }
  if (e.target.closest("a")) return;
  const ex = e.target.closest(".ex"); if (ex){ ex.classList.toggle("open"); return; }
  const front = e.target.closest(".front"); if (front){ front.parentElement.classList.toggle("open"); return; }
  const tab = e.target.closest(".tab"); if (tab){ TAB = tab.dataset.t; store.set("jc:tab", TAB); render(); window.scrollTo(0,0); }
});
$("#filter").onclick = () => { ONLY_WEAK = !ONLY_WEAK; store.set("jc:weak", ONLY_WEAK); render(); };
$("#lesson").onchange = e => { store.set("jc:lesson", e.target.value); load(e.target.value); };

async function load(id){
  try {
    const r = await fetch(`data/${id}.json`, {cache: "no-cache"});
    DATA = await r.json(); render(); window.scrollTo(0,0);
  } catch(err){ $("#list").innerHTML = `<div class="empty">Could not load ${esc(id)}.</div>`; }
}
(async function init(){
  $("#ver").textContent = APP_VERSION;
  try { INDEX = await (await fetch("data/index.json", {cache:"no-cache"})).json(); }
  catch(e){ $("#list").innerHTML = `<div class="empty">Could not load lesson list.</div>`; return; }
  const sel = $("#lesson");
  sel.innerHTML = INDEX.map(x => `<option value="${x.id}">${x.level} · Day ${x.day}  (${x.counts[0]}語 ${x.counts[1]}字 ${x.counts[2]}文法)</option>`).join("");
  const saved = store.get("jc:lesson", null);
  sel.value = INDEX.some(x => x.id === saved) ? saved : INDEX[0].id;
  load(sel.value);
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
