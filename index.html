<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JLPT Cards">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>JLPT Cards</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --soft:#6b6b70; --line:#e6e4df;
  --hl:#d93025; --word:#2b5fd9; --kanji:#7b3fc4; --gram:#d7700f; --dot:#c9c7c1; --chip:#efeee9;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121317; --card:#1c1e24; --ink:#ecebe8; --soft:#9a9aa2; --line:#2c2f37;
  --hl:#ff6b5e; --word:#7aa2ff; --kanji:#c49bff; --gram:#ffb259; --dot:#454852; --chip:#262932;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
select{flex:1;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:10px;background:var(--chip);color:var(--soft);font-weight:600;font-size:14px}
.tab.on{color:#fff}
.tab.on[data-t=words]{background:var(--word)} .tab.on[data-t=kanji]{background:var(--kanji)} .tab.on[data-t=grammar]{background:var(--gram)}
.meta{font-size:12px;color:var(--soft);margin-top:6px;display:flex;justify-content:space-between}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 40px);max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:14px;margin-bottom:10px;border-left:5px solid var(--word);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.k{border-left-color:var(--kanji)} .card.g{border-left-color:var(--gram)}
.front{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;cursor:pointer}
.num{font-size:12px;color:var(--soft);min-width:30px}
.head{flex:1;min-width:0}
.big{font-size:26px;font-weight:700;line-height:1.25;word-break:break-word}
.card.g .big{font-size:20px}
.rd{font-size:14px;color:var(--soft)}
.dots{display:flex;gap:7px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--dot)}
.dot.on{background:var(--hl);border-color:var(--hl)}
.back{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
.card.open .back{display:block}
.back h4{margin:12px 0 4px;font-size:13px;color:var(--soft);font-weight:600}
.en{font-weight:700}
.jp{margin-top:6px}
.src{font-size:12px;color:var(--soft)} .src a{color:var(--soft)}
b.hl{color:var(--hl)}
.ex{background:var(--chip);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.ex .tr{display:none;color:var(--soft);font-size:14px;margin-top:4px}
.ex.open .tr{display:block}
.ex .tip{float:right;font-size:12px;color:var(--soft)}
.img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:10px}
ul.w{margin:4px 0;padding-left:18px} ul.w li{margin:4px 0}
.exl{font-size:14px;color:var(--soft)}
code{background:var(--chip);padding:2px 6px;border-radius:6px;font-size:14px}
.empty{color:var(--soft);text-align:center;padding:40px}
button.small{font:inherit;font-size:13px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="row">
    <select id="lesson"></select>
    <button class="small" id="filter" title="Show only cards with fewer than 3 dots">All</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="words">Words</div>
    <div class="tab" data-t="kanji">Kanji</div>
    <div class="tab" data-t="grammar">Grammar</div>
  </div>
  <div class="meta"><span id="count"></span><span id="ver"></span></div>
</header>
<main id="list"><div class="empty">Loading…</div></main>

<script>
const APP_VERSION = "v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text, targets){
  let out = esc(text);
  for (const t of [].concat(targets).filter(Boolean).sort((a,b)=>b.length-a.length)){
    const e = esc(t);
    if (out.includes(e)) { out = out.split(e).join(`<b class="hl">${e}</b>`); break; }
  }
  return out;
}
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let INDEX = [], DATA = null, TAB = new URLSearchParams(location.search).get("tab") || store.get("jc:tab", "words"), ONLY_WEAK = store.get("jc:weak", false);

function dotsKey(type, no){ return `jc:dots:${DATA.level}:${type}:${no}`; }
function dotsHTML(type, no){
  const v = store.get(dotsKey(type, no), [0,0,0]);
  return `<div class="dots" data-type="${type}" data-no="${no}">` +
    v.map((on,i)=>`<div class="dot${on?" on":""}" data-i="${i}"></div>`).join("") + `</div>`;
}
function exHTML(e, targets){
  const tr = e.en ? esc(e.en) : "—";
  const src = e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.src||"source")}</a>` : "";
  return `<div class="ex"><span class="tip">EN ▾</span>${e.src && e.src.startsWith("Wikipedia") ? "🌐 " : ""}${hl(e.jp, targets)}<div class="tr">${tr}${src}</div></div>`;
}
function srcLine(label, url){ return `<div class="src">— ${esc(label)}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">link</a>` : ""}</div>`; }

function wordCard(c){
  const back = [
    c.img ? `<img class="img" loading="lazy" src="${esc(c.img)}" alt="">` : "",
    `<h4>English</h4><div class="en">${esc(c.en)}</div>`,
    c.jp ? `<h4>大辞泉</h4><div class="jp">${hl(c.jp, c.word)}</div>${srcLine("デジタル大辞泉 (Kotobank)", c.jpUrl)}` : "",
    c.use ? `<h4>例文</h4>${exHTML(c.use, c.word)}` : ""
  ].join("");
  return card("w", c.no, `<div class="big">${esc(c.word)}</div><div class="rd">${esc(c.reading)}</div>`, back);
}
function kanjiCard(c){
  const words = c.words.length ? `<h4>言葉</h4><ul class="w">` + c.words.map(w =>
      `<li>${hl(w.w, c.kanji)}（${esc(w.r)}）— ${esc(w.m)}${w.ex ? `<div class="exl">例：${hl(w.ex, c.kanji)}</div>` : ""}</li>`).join("") + `</ul>` : "";
  const back = [
    `<h4>読み</h4><div>音 <b>${esc(c.on.join("・")||"—")}</b>　訓 <b>${esc(c.kun.join("・")||"—")}</b>　<span class="src">${c.strokes}画</span></div>`,
    `<h4>意味</h4><div class="en">${esc(c.en)}</div>`,
    c.jp ? `<div class="jp">${hl(c.jp, c.kanji)}</div>${srcLine("デジタル大辞泉［漢字項目］", c.jpUrl)}` : "",
    words,
    c.use ? `<h4>例文</h4>${exHTML(c.use, c.kanji)}` : ""
  ].join("");
  const rd = [c.on.join("・"), c.kun.join("・")].filter(Boolean).join(" · ");
  return card("k", c.no, `<div class="big">${esc(c.kanji)}</div><div class="rd">${esc(rd)}</div>`, back);
}
function grammarCard(c){
  const back = [
    c.en ? `<h4>English</h4><div class="en">${esc(c.en)}</div>` : "",
    c.imi.length ? `<h4>意味</h4>${c.imi.map(x=>`<div>${esc(x)}</div>`).join("")}` : "",
    c.setsuzoku.length ? `<h4>接続</h4><code>${esc(c.setsuzoku.join(" / "))}</code>` : "",
    c.rei.length ? `<h4>例文 <span class="src">(tap for English)</span></h4>${c.rei.map(e=>exHTML(e, c.variants)).join("")}` : "",
    srcLine("日本語教師NET", c.url)
  ].join("");
  return card("g", c.no, `<div class="big">${esc(c.pattern)}</div>`, back);
}
function card(t, no, head, back){
  const type = {w:"words",k:"kanji",g:"grammar"}[t];
  return `<div class="card ${t}" data-type="${type}" data-no="${no}">
    <div class="front"><div class="num">#${t.toUpperCase()}${no}</div><div class="head">${head}</div>${dotsHTML(type,no)}</div>
    <div class="back">${back}</div></div>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("on", el.dataset.t === TAB));
  $("#filter").textContent = ONLY_WEAK ? "Weak" : "All";
  if (!DATA) return;
  let items = DATA[TAB];
  if (ONLY_WEAK) items = items.filter(c => store.get(dotsKey(TAB, c.no), [0,0,0]).filter(Boolean).length < 3);
  const make = {words: wordCard, kanji: kanjiCard, grammar: grammarCard}[TAB];
  $("#list").innerHTML = items.length ? items.map(make).join("") : `<div class="empty">Nothing here.</div>`;
  $("#count").textContent = `${DATA.level} Day ${DATA.day} · ${items.length} cards`;
  const q = new URLSearchParams(location.search);
  if (q.has("open")) document.querySelectorAll(".card").forEach((c,i)=>{ if(i<+q.get("open")) c.classList.add("open"); });
  if (q.has("ex")) document.querySelectorAll(".ex").forEach(x=>x.classList.add("open"));
}

document.addEventListener("click", e => {
  const dot = e.target.closest(".dot");
  if (dot){
    const box = dot.parentElement, k = dotsKey(box.dataset.type, box.dataset.no);
    const v = store.get(k, [0,0,0]); v[+dot.dataset.i] = v[+dot.dataset.i] ? 0 : 1; store.set(k, v);
    dot.classList.toggle("on", !!v[+dot.dataset.i]); return;
  }
  if (e.target.closest("a")) return;
  const ex = e.target.closest(".ex"); if (ex){ ex.classList.toggle("open"); return; }
  const front = e.target.closest(".front"); if (front){ front.parentElement.classList.toggle("open"); return; }
  const tab = e.target.closest(".tab"); if (tab){ TAB = tab.dataset.t; store.set("jc:tab", TAB); render(); window.scrollTo(0,0); }
});
$("#filter").onclick = () => { ONLY_WEAK = !ONLY_WEAK; store.set("jc:weak", ONLY_WEAK); render(); };
$("#lesson").onchange = e => { store.set("jc:lesson", e.target.value); load(e.target.value); };

async function load(id){
  try {
    const r = await fetch(`data/${id}.json`, {cache: "no-cache"});
    DATA = await r.json(); render(); window.scrollTo(0,0);
  } catch(err){ $("#list").innerHTML = `<div class="empty">Could not load ${esc(id)}.</div>`; }
}
(async function init(){
  $("#ver").textContent = APP_VERSION;
  try { INDEX = await (await fetch("data/index.json", {cache:"no-cache"})).json(); }
  catch(e){ $("#list").innerHTML = `<div class="empty">Could not load lesson list.</div>`; return; }
  const sel = $("#lesson");
  sel.innerHTML = INDEX.map(x => `<option value="${x.id}">${x.level} · Day ${x.day}  (${x.counts[0]}語 ${x.counts[1]}字 ${x.counts[2]}文法)</option>`).join("");
  const saved = store.get("jc:lesson", null);
  sel.value = INDEX.some(x => x.id === saved) ? saved : INDEX[0].id;
  load(sel.value);
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
